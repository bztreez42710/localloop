{% extends 'base.html' %}{% block content %}<link rel="stylesheet" href="/static/portal.css"><div class="panel narrow"><span class="eyebrow">CREATE ACCOUNT</span><h1>Join LocalLoop</h1><p class="muted">Customers, independent drivers, and local stores can create accounts here. Staff accounts are created privately by the owner.</p><form method="post"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<div class="password-wrap"><input id="registerPassword" name="password" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-target="registerPassword">Show</button></div></label><label>Account type<select id="roleSelect" name="role"><option value="customer">Customer</option><option value="driver">Independent driver</option><option value="business">Local store / business</option></select></label><label>Business name (store/business accounts)<input name="business_name"></label><label class="checkline"><input type="checkbox" name="accept_terms" value="yes" required> I agree to the <a href="/legal/terms" target="_blank">Terms of Use</a> and acknowledge the <a href="/legal/privacy" target="_blank">Privacy Policy</a>.</label><label class="checkline" id="driverAgreementRow" style="display:none"><input id="driverAgreementBox" type="checkbox" name="accept_driver" value="yes"> As an independent driver, I also agree to the <a href="/legal/driver-agreement" target="_blank">Driver Agreement</a>.</label><button class="button">Create account</button></form><p class="help-text"><a href="/legal">Review all LocalLoop legal and safety policies</a></p></div><script>document.querySelectorAll('.password-toggle').forEach(btn=>btn.addEventListener('click',()=>{const i=document.getElementById(btn.dataset.target);const show=i.type==='password';i.type=show?'text':'password';btn.textContent=show?'Hide':'Show';}));const role=document.getElementById('roleSelect'),row=document.getElementById('driverAgreementRow'),box=document.getElementById('driverAgreementBox');function sync(){const d=role.value==='driver';row.style.display=d?'block':'none';box.required=d;if(!d)box.checked=false;}role.addEventListener('change',sync);sync();</script>{% endblock %}
