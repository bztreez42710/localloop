{% extends 'base.html' %}{% block content %}<link rel="stylesheet" href="/static/portal.css"><div class="panel narrow"><span class="eyebrow">CREATE ACCOUNT</span><h1>Join LocalLoop</h1><p class="muted">Customers, independent drivers, and local stores can create accounts here. Staff accounts are created privately by the owner.</p><form method="post"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<div class="password-wrap"><input id="registerPassword" name="password" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-target="registerPassword">Show</button></div></label><label>Account type<select name="role"><option value="customer">Customer</option><option value="driver">Independent driver</option><option value="business">Local store / business</option></select></label><label>Business name (store/business accounts)<input name="business_name"></label><button class="button">Create account</button></form></div><script>document.querySelectorAll('.password-toggle').forEach(btn=>btn.addEventListener('click',()=>{const i=document.getElementById(btn.dataset.target);const show=i.type==='password';i.type=show?'text':'password';btn.textContent=show?'Hide':'Show';}));</script>{% endblock %}
