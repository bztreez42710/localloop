{% extends 'base.html' %}{% block content %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><section class="page-head"><span class="eyebrow">ROUTE NAVIGATION</span><h1>Delivery #{{delivery.id}}</h1><p class="lead">{{delivery.pickup}} → {{delivery.dropoff}}</p></section><div class="panel"><div id="navMap" style="height:500px;border-radius:16px"></div><div class="actions"><button class="button" id="startGps">Start live GPS</button><a class="button ghost" target="_blank" rel="noopener" href="https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route={{delivery.pickup_lat}},{{delivery.pickup_lng}};{{delivery.dropoff_lat}},{{delivery.dropoff_lng}}">Open turn-by-turn directions</a></div><p class="help-text">Routing uses OpenStreetMap/Open Source Routing Machine data. Always follow road signs and local traffic laws.</p></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('navMap').setView([47.6588,-117.4260],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const a=[{{delivery.pickup_lat}},{{delivery.pickup_lng}}],b=[{{delivery.dropoff_lat}},{{delivery.dropoff_lng}}];L.marker(a).addTo(map).bindPopup('Pickup');L.marker(b).addTo(map).bindPopup('Drop-off');map.fitBounds([a,b],{padding:[35,35]});let me=null;document.getElementById('startGps').onclick=()=>{if(!navigator.geolocation){alert('GPS is not available in this browser.');return;}navigator.geolocation.watchPosition(async p=>{const lat=p.coords.latitude,lon=p.coords.longitude;if(me)me.setLatLng([lat,lon]);else me=L.marker([lat,lon]).addTo(map).bindPopup('You');const body=new URLSearchParams({latitude:lat,longitude:lon});try{await fetch('/driver/location',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});}catch(e){}},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});};</script>{% endblock %}
